<section class="intro"><p>見える音だけが、誰かに盗まれている。</p><h1>夜の通りが空になる理由</h1><p class="lede">雨宿りした先は知らない街。音は普通に聞こえるのに、その文字だけがおかしな場所に浮いている。</p><details><summary>操作方法</summary><p>文字をドラッグして、宛先へ置いてください。下の選択ボタンからも操作できます。スマホは指でドラッグできます。失敗してもやり直せます。</p></details></section>
<nav id="chapters" aria-label="場面選択"></nav><section class="panel"><div class="frame"><div id="visual"></div><div class="clockline"><span id="location"></span><strong id="time"></strong></div></div><div class="content"><span class="act" id="act"></span><h2 id="title"></h2><p id="lead" class="lead"></p><div id="dialogues"></div><section id="interaction" class="interaction"><h3 id="question"></h3><div id="interact-ui"></div><p id="feedback" class="feedback" aria-live="polite"></p></section></div></section>
<div class="controls"><button id="back" type="button">前の場面</button><span id="indicator">01 / 07</span><button id="forward" type="button">次の場面へ →</button></div><section id="end" class="end" hidden><h2>そして、昼の街へ。</h2><p>巨大な鳥は川の向こうへ。今朝は誰も音字を隠さなくていい。</p><p id="epilogue"></p><button id="again" type="button">最初から読み直す</button></section><footer>実音と音字は別。音字を動かしても音源は変わりません。</footer></main><script type="module" src="./app.js"></script></body></html>
